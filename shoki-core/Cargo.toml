[package]
name = "shoki-core"
# **公開しないので、この版に意味は無い**。アプリのバージョンの正は `shoki` の `version`
# （#74。`env!("CARGO_PKG_VERSION")` で画面に出る）。ここを上げても何も変わらない。
version = "0.0.0"
edition.workspace = true
publish = false

# **足してよいのは純粋なものだけ**（#187 / #188）。基準は 1 つ——ファイルを読む・スレッドを
# 立てる・時刻を取る・画面を触る・ネットワークに出るクレートは入れない。それらは `shoki` 側
# （shell）に置き、core は値を受け取って値を返す。
#
# 例: `serde`（保存形式の型）は足してよい。`chrono` も足してよいが、**使ってよいのは型と整形
# だけ**（`NaiveDateTime` など）——`Utc::now()` / `Local::now()` は時刻という外の事実を取るので
# shell が呼び、`Event` に載せて渡す（`Local::now()` は環境変数と `/etc/localtime` も読む）。
# 足すときは `clippy.toml` の `disallowed-methods` にその 2 つを同じ PR で足すこと。
#
# いま `shoki` にある `slint` / `whisper-rs` / `llama-cpp-2` / `rodio` / `cpal` / `ureq` /
# `objc2` 系は足さない。
#
# 何が守られていて何が守られていないかは `src/lib.rs` の doc が正（`std` の I/O はクレート境界
# では止まらないので、`clippy.toml` で入り口を塞いでいる）。
[dependencies]
# **`clock` を足さない**（版と既定の機能は `[workspace.dependencies]` が持つ）。
#
# `clock` は `Local` と、それが含意する `now`（`Utc::now`）を生やす。足さなければ
# `chrono::Local` は**型として存在せず**、`Utc::now` も**メソッドとして存在しない**——core から
# 現在時刻を取る書き方はコンパイルを通らない。
#
# **守れるのは `cargo build -p shoki-core` のときだけ**。`shoki` が `clock` 付きで要求するので、
# ワークスペースをまとめて建てると機能が合流して両方とも生える。だから CI は core を単体でも
# 建てる（`.github/workflows/ci.yml`）。合流したときの経路は `clippy.toml` の
# `disallowed-methods` が塞ぐ（二の矢）。
#
# **core に依存を足すときは、それが `chrono` の `clock` / `now` を引かないことも確かめる**。
# 引くと単体ビルドでも生えるので、一の矢が黙って消える。
chrono = { workspace = true }
