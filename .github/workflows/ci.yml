name: CI

on:
  push:
    branches: [main]
  pull_request:

# **トークンの権限はここで宣言する**。既定はリポジトリ設定側にあり、ワークフローの外で
# 変えられてしまう——このワークフローが要るのは checkout だけなので、読み取りだけに固定する。
permissions:
  contents: read

# 同一参照で古い実行が走っていればキャンセルする（無駄な実行を避ける）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit（依存の脆弱性検査）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-audit はビルド不要で Cargo.lock を RUSTSEC アドバイザリ DB と照合するだけなので、
      # OS 依存のシステムライブラリは要らない。prebuilt をインストールして高速に回す。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # 既知脆弱性が見つかると cargo audit は非ゼロ終了し、このジョブが失敗する。
      # 運用方針: 誤検知や未対応アドバイザリを一時的に無視する場合は、レビューのうえ
      # この行を `cargo audit --ignore RUSTSEC-XXXX-XXXX` の形に変更し、無視する理由を
      # コミットメッセージに残す（恒久的な無視は安易に増やさない）。
      #
      # 無視理由:
      # - RUSTSEC-2026-0194 / RUSTSEC-2026-0195（quick-xml の DoS）: quick-xml は
      #   rfd → wayland-scanner 経由の Linux 専用・ビルド時依存で、macOS の出荷バイナリには
      #   含まれない。入力はビルド時に読む信頼できる Wayland プロトコル XML のみ。修正版
      #   0.41 は wayland-scanner ^0.39 に阻まれ現状取り込めないため一時的に無視する。
      #   （wayland/rfd チェーンが 0.41 対応版に上がったら --ignore を外す）
      - run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  check:
    name: build / fmt / clippy / test
    # macOS 優先のアプリで objc2 等の macOS 依存を含むため、macOS ランナーで検証する。
    runs-on: macos-latest
    steps:
      # アイコン生成物の同期検査（下記）で base との差分を見るため、履歴ごと取得する
      # （リポジトリは小さく、全履歴でも 10MB 未満）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # アイコン生成物の同期検査。`assets/icon/mark.svg`（形の正）を変えたのに生成物を再生成し
      # 忘れると、メニューバーのアイコンだけ古い形のまま出荷される（tray.png は include_bytes!
      # でバイナリに入る）。検査はラスタライズと actool を伴うので、コミット済みの生成物と同じ
      # macOS 上で行う（このジョブ）。アイコン資産に触れた変更のときだけ走らせる（毎回
      # brew install すると全 PR が遅くなる）。
      #
      # **この 3 ステップは下の「安定版 Xcode を選択」より前に置くこと**: Icon Composer 形式の
      # `.icon` は Xcode 26 以降の actool でないと扱えず、Xcode 16 を選んだ後だと .icns の生成に
      # 失敗する。Rust のビルドより先に置くのは、アイコンだけの変更を早く落とすため。
      - name: アイコン資産の変更有無を判定
        id: icons_changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "比較元が取れないため検査する（ブランチ作成直後など）。"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # パイプを使わず pathspec で判定する（`git diff | grep -q` は grep の早期終了で
          # git が SIGPIPE 死し、pipefail のため「変更なし」と誤判定する）。
          # ci.yml 自身も対象に含める（この検査を編集した PR で自己検証できるように）。
          if git diff --quiet "$base" HEAD -- \
               assets/icon scripts/generate-icons.sh scripts/check-icons.sh \
               .github/workflows/ci.yml; then
            echo "アイコン資産に変更が無いため検査をスキップする。"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "アイコン資産に変更があるため検査する。"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 検査に使うツールを用意（rsvg-convert / magick）
        if: steps.icons_changed.outputs.run == 'true'
        run: |
          for formula in librsvg imagemagick; do
            brew list "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
      - name: アイコン生成物がマスターと一致するか
        if: steps.icons_changed.outputs.run == 'true'
        run: ./scripts/check-icons.sh
      # ランナー既定の Xcode がベータ版だと Swift 後方互換ライブラリ
      # （libswiftCompatibilityConcurrency.a・libswiftCompatibility56.a）を含まないことがあり、
      # screencapturekit / apple-* が Swift ブリッジに埋め込む force-load シンボルを
      # リンクできず build が失敗する（ローカルの安定版 Xcode では通る）。既定に依存せず、
      # 互換ライブラリを確実に含む安定版 Xcode 16 系を明示選択して決定的にする。
      - name: 安定版 Xcode を選択（Swift 後方互換ライブラリ確保）
        run: |
          xcode="$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$xcode" ]; then
            echo "Xcode 16 系が見つからない。既定 Xcode を使用する。" >&2
            xcode="/Applications/Xcode.app"
          fi
          echo "Selecting $xcode"
          sudo xcode-select -switch "$xcode/Contents/Developer"
          swiftlib="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macosx"
          if [ ! -e "$swiftlib/libswiftCompatibilityConcurrency.a" ]; then
            echo "Swift 後方互換ライブラリが見つからない: $swiftlib" >&2
            exit 1
          fi
      # whisper-rs が whisper.cpp を、llama-cpp-2（検証プローブ用の dev-dependency）が llama.cpp を
      # CMake でビルドする（README の前提と対応）。macOS ランナーには CMake がプリインストール
      # されているが、暗黙依存のままイメージ更新で外れると原因が分かりにくいので、ここで存在を
      # 明示的に確認して早く・明確に失敗させる。
      - name: CMake の存在確認（whisper.cpp / llama.cpp のビルドに必要）
        run: cmake --version
      # **バージョンは `rust-toolchain.toml` が正**（#156。rustup の挙動と上げ方はあちら）。
      # `dtolnay/rust-toolchain` は `toolchain` の明示を要求する——アクションに版を書くと
      # ファイルと二重管理になり、片方だけ古くなる余地が残るので、使わず rustup に任せる。
      - name: Rust ツールチェーンの用意（rust-toolchain.toml に従う）
        run: |
          # `cargo` を叩けば自動で入るが、ここで先に用意して早く失敗させる。rustup 1.28 以降の
          # `show` は未導入のツールチェーンを暗黙に入れなくなったので、後段で明示的に入れる。
          rustup show active-toolchain || rustup toolchain install
          # **固定が効いていることを確かめる**。`RUSTUP_TOOLCHAIN` や `[toolchain] path` は
          # ファイルを黙って上書きするので、照合しないと固定が外れたまま緑で通ってしまう
          # ——それでは「手元と CI で同じ Rust」という前提がいつ崩れたか分からない。
          expected="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          actual="$(rustc --version)"
          if ! printf '%s' "$actual" | grep -q "^rustc $expected "; then
            echo "rust-toolchain.toml は $expected だが、実際は $actual" >&2
            exit 1
          fi
          echo "$actual"
          cargo clippy --version
          cargo fmt --version
      - uses: Swatinem/rust-cache@v2
      # `--workspace` / `--all` を落とさないこと（#187。理由は
      # `docs/rules/coding-conventions.md` の「検証コマンド」）。
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --verbose
      - name: test
        run: cargo test --workspace --verbose
