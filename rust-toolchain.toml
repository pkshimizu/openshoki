# 手元と CI で**同じ Rust を使う**ための固定（#156）。
#
# rustup はこのファイルを自動で読み、書かれたバージョンが無ければ取ってくる。CI も同じファイルを
# 見るので、「手元では通ったのに CI で落ちる」が起きない。
#
# 固定する前は CI が `stable`（そのときの最新）、手元は更新を忘れて古いまま、という差があった。
# clippy の lint はバージョンが上がるたびに増えるので、CI だけが新しいと**手元では検出しようが
# ない指摘**で赤くなる（#152 で 3 度落とした）。
#
# ## 上げ方
#
# 1. `rustup check` で最新の安定版を確認する
# 2. 下の `channel` をその版へ書き換える
# 3. `cargo clippy --all-targets -- -D warnings` を通す（新しい lint が出ることがある。
#    差分ビルドでは見逃すので、`touch src/*.rs src/windows/*.rs` してから回す。
#    `docs/rules/testing.md`）
# 4. 上げたこと自体を 1 コミットにする（他の変更と混ぜると、lint 対応の差分が読めなくなる）
#
# 上げる頻度は決めていない。落ちてから上げるのではなく、**新機能や lint が要るときに上げる**。
[toolchain]
channel = "1.98.0"
# CI がこの 2 つを使う（`cargo fmt --check` / `cargo clippy`）。ここに書いておけば、
# ワークフロー側で `components:` を指定しなくてよい。
components = ["rustfmt", "clippy"]
