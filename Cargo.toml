[package]
name = "openshoki"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
cpal = "0.18.1"
directories = "6.0.0"
fs2 = "0.4.3"
mp3lame-encoder = { version = "0.2.4", features = ["std"] }
png = "0.18"
rfd = "0.17.2"
rodio = "0.22.2"
rubato = "4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# raw-window-handle-06: メニューからの前面化でネイティブウィンドウを得る（bring_to_front 参照）。
slint = { version = "1.17.0", features = ["raw-window-handle-06"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
toml = "1.1.2"
trash = "5.2.6"
tray-icon = "0.24.1"
ureq = "3"
whisper-rs = "0.16.0"

[dev-dependencies]
# UI 操作（クリック・ドラッグ）を実際のポインタイベントで検証するテストバックエンド
# （`tests/ui_*.rs`。使い方は `docs/rules/slint.md`）。テスト専用で出荷バイナリには入らない。
# `i-slint-core` を厳密指定で依存するため、`slint` / `slint-build` とバージョンを揃えること。
i-slint-backend-testing = "1.17.0"

[build-dependencies]
slint-build = "1.17.0"

# MAS 可否の技術検証プローブ（#77、`examples/mas_probe.rs`）専用。security-scoped bookmark を
# 扱う NSURL 系 feature をここで足す。dev-dependencies なので `cargo build`（出荷バイナリ）の
# feature は増えない（`cargo test` / `cargo clippy --all-targets` では feature 合成で乗る）。
# プローブが使う feature は通常依存側の指定に頼らず全部書く（あちらから外れても壊れないように）。
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "0.3.2", features = [
  "NSURL",
  "NSData",
  "NSError",
  "NSArray",
  "NSBundle",
  "NSString",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
# 選択した .app からバンドル ID・表示名を読むために NSBundle を使う（NSRunningApplication は
# objc2-app-kit の既定 features に含まれる）。
objc2-foundation = { version = "0.3.2", features = ["NSBundle", "NSString"] }
# 既定入力デバイスの稼働状態（IsRunningSomewhere）を CoreAudio のプロパティリスナーで監視する。
# cpal が依存ツリーに持つ objc2 系の CoreAudio バインディングを直接使う（追加ビルドコストなし）。
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
# macos_13_0 feature でシステム音声キャプチャ API（captures_audio 等）が有効になる。
screencapturekit = { version = "8.0.0", features = ["macos_13_0"] }
# Slint ウィンドウから NSWindow を取り出すハンドル連携（メニューからの前面化。bring_to_front 参照）。
raw-window-handle = "0.6"
